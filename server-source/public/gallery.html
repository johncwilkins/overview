<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BitterRadish · Galleries</title><link rel="icon" href="favicon.svg?v=2" type="image/svg+xml"><link rel="alternate icon" href="favicon.ico?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><link rel="stylesheet" href="media-browser.css"><style>body{font:15px Arial;max-width:900px;margin:40px auto;padding:0 25px;color:#222}a{color:#0000b5}h1{font:32px Georgia}button{font:14px Arial;cursor:pointer;padding:10px 15px;border:1px solid #bbb;background:#f5f5f5}#description{line-height:1.8;white-space:pre-wrap}</style></head><body><a href="/">← BitterRadish</a><h1 id="title">Galleries</h1><p id="description">Photo collections.</p><button id="open">Open photo browser</button><script src="media-browser.js"></script><script>const q=new URLSearchParams(location.search);async function open(){if(q.get('id'))await BRMediaBrowser.openGallery(q.get('id'),q.has('preview'));else{try{const r=await fetch('/api/projects');if(!r.ok)throw new Error('Collections could not be loaded.');const projects=await r.json();BRMediaBrowser.openCollections(projects.filter(p=>p.type==='gallery'));}catch(e){document.querySelector('#description').textContent=e.message}}}document.querySelector('#open').addEventListener('click',open);open();</script></body></html>
